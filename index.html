<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#F26B1D;--c2:#5B2FD0;--bg:#ECEDF0;--ink:#1A1A22;--mut:#5A5E6B;--card:#fff;--line:#D8DAE1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Figtree",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Sora","Figtree",sans-serif;margin:0;line-height:1.1}
a{color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;justify-content:center;align-items:center;background:var(--c2);color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:12px 18px;border:0;cursor:pointer;font-size:.95rem}
.btn.b2{background:var(--c1);color:#1A1A22}
.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
header{padding:calc(14px + env(safe-area-inset-top,0)) 0 14px}
header .w{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:800 1.3rem "Sora",sans-serif;text-decoration:none}
#hero{position:relative;display:grid;margin:0 auto;max-width:1100px;border-radius:24px;overflow:hidden;background:linear-gradient(115deg,var(--c2) 55%,#B4400F 135%);color:#fff}
.sl{grid-area:1/1;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:44px 44px 64px;opacity:0;visibility:hidden;transition:opacity .6s}
.sl.on{opacity:1;visibility:visible}
.sl h1{font-size:clamp(1.9rem,4.6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.sl p{margin:14px 0 22px;max-width:40ch;opacity:.92;font-size:1.08rem}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:#fff;color:var(--ink);border-radius:14px;overflow:hidden;text-decoration:none;display:block}
.mini .im{aspect-ratio:4/3}
.mini div.t{padding:8px 10px;font-weight:700;font-size:.9rem;line-height:1.25}
.mini small{display:block;color:var(--mut);font-weight:500}
.dots{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:8px}
.dots button{width:11px;height:11px;border-radius:99px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0}
.dots button.on{background:var(--c1);width:30px}
.im{background:color-mix(in srgb,var(--cc,#888) 22%,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im b{font:800 2.4rem "Sora",sans-serif;color:var(--cc,#888)}
#catalogo{padding:56px 0 24px}
#catalogo>.w>h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
.sub{color:var(--mut);margin:8px 0 22px;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.chip{border:2px solid var(--cc,var(--ink));background:transparent;color:var(--ink);border-radius:99px;padding:7px 16px;font:700 .92rem "Figtree",sans-serif;cursor:pointer}
.chip.on{background:var(--cc,var(--ink));color:#fff}
.cat{margin-top:34px}
.cat h2{font-size:1.5rem;border-left:8px solid var(--cc);padding-left:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border-top:6px solid var(--cc)}
.card .im{aspect-ratio:4/3}
.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--cc) 20%,#fff)}
.bd h3{font-size:1.08rem;font-weight:600}
.bd p{margin:0;color:var(--mut);font-size:.93rem;flex:1}
.pr{font-weight:800;font-size:1.15rem}
.bd .btn{width:100%}
footer{padding:36px 0 110px;color:var(--mut);font-size:.92rem}
.fl{position:fixed;right:max(16px,env(safe-area-inset-right,0));bottom:calc(16px + env(safe-area-inset-bottom,0));box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:99px;padding:14px 22px}
#hero,.hm{margin-left:auto;margin-right:auto}
.hm{max-width:1100px;padding:0 20px}
@media(max-width:760px){.sl{grid-template-columns:1fr;padding:30px 22px 56px}.mn{grid-template-columns:repeat(2,1fr)}#hero{border-radius:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sl{transition:none}}
</style>
</head>
<body>
<header><div class="w"><a class="brand" href="#" id="nome">Loja</a><a class="btn" id="wh" target="_blank" rel="noopener">WhatsApp</a></div></header>
<div id="hero" aria-live="polite"></div>
<main id="catalogo"><div class="w">
  <h2 id="ct"></h2><p class="sub" id="cs"></p>
  <div class="chips" id="chips"></div>
  <div id="cats"></div>
</div></main>
<footer><div class="w" id="rod"></div></footer>
<a class="btn fl" id="fl" target="_blank" rel="noopener">WhatsApp</a>
<script>
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
fetch('data.json?'+Date.now()).then(function(r){return r.json()}).then(init).catch(function(){$('#cats').textContent='Não foi possível carregar o catálogo.'});
function init(D){
  var st=document.documentElement.style;st.setProperty('--c1',D.cor1);st.setProperty('--c2',D.cor2);
  document.title=D.nome;$('#nome').textContent=D.nome;$('#ct').textContent=D.catTitulo;$('#cs').textContent=D.catSub;$('#rod').textContent=D.rodape;
  function wa(m){return 'https://wa.me/'+D.whatsapp+'?text='+encodeURIComponent(m)}
  $('#wh').href=wa('Olá! Vim pelo site.');$('#fl').href=wa('Olá! Vim pelo site e tenho uma dúvida.');
  function cat(id){return D.cats.filter(function(c){return c.id==id})[0]||{nome:'',cor:'#888'}}
  function prod(id){return D.prods.filter(function(p){return p.id==id})[0]}
  function money(v){return v===''||v==null?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
  function img(p){return '<div class="im" style="--cc:'+esc(cat(p.cat).cor)+'">'+(p.img?'<img loading="lazy" src="'+esc(p.img)+'" alt="'+esc(p.nome)+'">':'<b>'+esc(p.nome.charAt(0))+'</b>')+'</div>'}
  function msg(p){return wa('Olá! Tenho interesse em: '+p.nome+(money(p.preco)?' ('+money(p.preco)+')':'')+'. Ainda está disponível?')}
  function mini(p){return '<a class="mini" target="_blank" rel="noopener" href="'+msg(p)+'">'+img(p)+'<div class="t">'+esc(p.nome)+'<small>'+money(p.preco)+'</small></div></a>'}
  function card(p){var c=cat(p.cat);return '<article class="card" style="--cc:'+esc(c.cor)+'">'+img(p)+'<div class="bd"><span class="tag">'+esc(c.nome)+'</span><h3>'+esc(p.nome)+'</h3><p>'+esc(p.desc)+'</p><div class="pr">'+money(p.preco)+'</div><a class="btn" target="_blank" rel="noopener" href="'+msg(p)+'">Pedir no WhatsApp</a></div></article>'}

  var hs=D.heroes.filter(function(h){return h.titulo||h.prods.length});
  $('#hero').innerHTML=hs.map(function(h,i){
    return '<div class="sl'+(i?'':' on')+'"><div><h1>'+esc(h.titulo)+'</h1><p>'+esc(h.sub)+'</p><a class="btn b2" href="#catalogo">'+esc(h.botao||'Ver catálogo')+'</a></div><div class="mn">'+h.prods.map(prod).filter(Boolean).slice(0,4).map(mini).join('')+'</div></div>'
  }).join('')+'<div class="dots">'+hs.map(function(h,i){return '<button aria-label="Slide '+(i+1)+'"'+(i?'':' class="on"')+'></button>'}).join('')+'</div>';
  var sl=document.querySelectorAll('.sl'),dt=document.querySelectorAll('.dots button'),cur=0,tm;
  function go(i){cur=i;sl.forEach(function(s,k){s.classList.toggle('on',k==i)});dt.forEach(function(d,k){d.classList.toggle('on',k==i)})}
  dt.forEach(function(d,k){d.onclick=function(){go(k);clearInterval(tm)}});
  if(sl.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches){tm=setInterval(function(){go((cur+1)%sl.length)},6500)}

  var sel='';
  function draw(){
    $('#chips').innerHTML='<button class="chip'+(sel?'':' on')+'" data-c="">Todos</button>'+D.cats.map(function(c){return '<button class="chip'+(sel==c.id?' on':'')+'" data-c="'+esc(c.id)+'" style="--cc:'+esc(c.cor)+'">'+esc(c.nome)+'</button>'}).join('');
    $('#cats').innerHTML=D.cats.filter(function(c){return !sel||c.id==sel}).map(function(c){
      var ps=D.prods.filter(function(p){return p.cat==c.id});
      return ps.length?'<section class="cat" style="--cc:'+esc(c.cor)+'"><h2>'+esc(c.nome)+'</h2><div class="grid">'+ps.map(card).join('')+'</div></section>':'';
    }).join('')||'<p class="sub">Nenhum produto nesta categoria ainda.</p>';
  }
  $('#chips').onclick=function(e){var b=e.target.closest('.chip');if(b){sel=b.getAttribute('data-c');draw()}};
  draw();
}
</script>
</body>
</html>
